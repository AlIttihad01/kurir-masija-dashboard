
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KURIR MASIJA - MSA GROUP</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#102b50;color:white;padding:22px;text-align:center}
header h1{margin:0;font-size:25px}
header p{margin:7px 0 0;color:#cbd5e1}
main{max-width:440px;margin:55px auto;padding:20px}
.panel{background:white;padding:28px;border-radius:16px;box-shadow:0 8px 30px #102b5018}
h2{text-align:center;margin-top:0;color:#102b50}
label{display:block;margin:16px 0 7px;font-weight:bold}
input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:8px;background:#e99b26;color:#102b50;font-weight:bold;font-size:16px;cursor:pointer}
button:hover{background:#f5b74d}
.note{text-align:center;font-size:13px;color:#64748b;margin-top:20px}
footer{text-align:center;color:#64748b;font-size:12px;margin:30px}
</style>
</head>
<body>
<header>
<h1>KURIR MASIJA</h1>
<p>MSA GROUP · ADMIN & OWNER DASHBOARD</p>
</header>
<main>
<section class="panel">
<h2>Selamat Datang</h2>
<p style="text-align:center;color:#64748b">Silakan login untuk mengelola KURIR MASIJA</p>
<form id="loginForm">
<label>Email</label>
<input type="email" id="email" placeholder="Masukkan email" required>
<label>Password</label>
<input type="password" id="password" placeholder="Masukkan password" required>
<button type="submit">LOGIN</button>
</form>
<p id="message" class="note">Dashboard khusus Admin dan Owner MSA GROUP</p>
</section>
</main>
<footer>© 2026 KURIR MASIJA – MSA GROUP</footer>
</body>
</html>
